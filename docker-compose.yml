version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://frontend:5173
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    restart: unless-stopped

  frontend:
    build: ./firepre
    ports:
      - "5173:5173"
    volumes:
      - ./firepre:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://backend:8000/api/v1
      - VITE_WEATHER_API_KEY=${WEATHER_API_KEY}
    depends_on:
      - backend
    restart: unless-stopped
